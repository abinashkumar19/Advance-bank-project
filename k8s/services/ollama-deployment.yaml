apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: veerabank
  labels:
    app: ollama
spec:
  replicas: 1
  # A first-ever pull of the model over the internet (Ollama's own
  # registry, not ECR) can genuinely take a while depending on network
  # speed - this needs real margin so Kubernetes doesn't mark the
  # rollout failed while it's still downloading. Every deploy after the
  # first is fast (the model persists on the PVC below, survives pod
  # restarts), but CI can't assume it isn't the first.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      serviceAccountName: backend-app
      # Schedule exclusively onto the dedicated Ollama node group
      # (terraform/modules/eks) - the taint there keeps every other pod
      # off it, and this toleration + nodeSelector pair is what lets
      # Ollama (and only Ollama) land there instead.
      nodeSelector:
        role: ollama
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ollama"
          effect: "NoSchedule"
      containers:
        - name: ollama
          image: "ollama/ollama:latest"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ollama serve &
              SERVE_PID=$!
              echo "Waiting for Ollama server to come up..."
              until ollama list >/dev/null 2>&1; do sleep 2; done
              echo "Pulling $OLLAMA_MODEL (no-op if already on the persisted volume)..."
              ollama pull "$OLLAMA_MODEL"
              echo "Ready."
              wait $SERVE_PID
          env:
            # A dedicated (but CPU-only) node still isn't as fast as GPU
            # inference would be, but a real 8-vCPU node the model
            # doesn't have to share with 30+ other pods is meaningfully
            # better than the old shared-t3.medium setup, and 7B is
            # noticeably more reliable at the multi-step tool-calling
            # this chatbot does (see backend/services/chatbot/app/main.py's
            # grounding-check comments) than the original 3B model. If
            # this is still too slow in practice, dropping back to
            # "qwen2.5:3b-instruct" is a one-line change - just keep this
            # in sync with OLLAMA_MODEL in
            # k8s/services/chatbot-deployment.yaml either way.
            - name: OLLAMA_MODEL
              value: "qwen2.5:7b-instruct"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          # m6i.2xlarge has 8 vCPU / 32GiB - generous headroom here since
          # this is the only pod that will ever land on this node (see
          # the taint/toleration above), unlike the tight t3.medium
          # sizing the app nodes need to share across many pods. No GPU
          # resource request - this is a standard compute instance now,
          # see the node group comment in terraform/modules/eks/main.tf
          # for why.
          resources:
            requests:
              cpu: "5000m"
              memory: "12Gi"
            limits:
              cpu: "7000m"
              memory: "20Gi"
          # Model pull on first boot can take a while depending on
          # network speed - startupProbe gives it room before
          # readiness/liveness start counting failures against it.
          startupProbe:
            exec:
              command: ["sh", "-c", "ollama list | grep -q \"$OLLAMA_MODEL\""]
            periodSeconds: 15
            failureThreshold: 120 # 30 minutes of grace on first pull - matches progressDeadlineSeconds above
          readinessProbe:
            exec:
              command: ["sh", "-c", "ollama list | grep -q \"$OLLAMA_MODEL\""]
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        # Persists the downloaded model across pod restarts - without
        # this, every restart re-downloads several GB for no reason.
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
