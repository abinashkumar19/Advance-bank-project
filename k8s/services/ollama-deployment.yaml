apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: veerabank
  labels:
    app: ollama
spec:
  replicas: 1
  # A first-ever pull of the model over the internet (Ollama's own
  # registry, not ECR) can genuinely take a while depending on network
  # speed - this needs real margin so Kubernetes doesn't mark the
  # rollout failed while it's still downloading. Every deploy after the
  # first is fast (the model persists on the PVC below, survives pod
  # restarts), but CI can't assume it isn't the first.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      serviceAccountName: backend-app
      # Schedule exclusively onto the GPU node group (terraform/modules/eks)
      # - the taint there keeps every other pod off it, and this
      # toleration + nodeSelector pair is what lets Ollama (and only
      # Ollama) land there instead.
      nodeSelector:
        role: gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: ollama
          image: "ollama/ollama:latest"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ollama serve &
              SERVE_PID=$!
              echo "Waiting for Ollama server to come up..."
              until ollama list >/dev/null 2>&1; do sleep 2; done
              echo "Pulling $OLLAMA_MODEL (no-op if already on the persisted volume)..."
              ollama pull "$OLLAMA_MODEL"
              echo "Ready."
              wait $SERVE_PID
          env:
            # GPU inference removes the speed constraint that motivated
            # keeping this small on CPU, so this is upgraded from the
            # earlier 3B model to a more capable one - directly helps the
            # tool-calling reliability the smaller model struggled with
            # (see backend/services/chatbot/app/main.py's grounding-check
            # comments), on top of being dramatically faster. Must match
            # OLLAMA_MODEL in k8s/services/chatbot-deployment.yaml.
            - name: OLLAMA_MODEL
              value: "qwen2.5:7b-instruct"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          # g4dn.xlarge has 4 vCPU / 16GiB / 1 GPU - generous headroom
          # here since this is the only pod that will ever land on this
          # node (see the taint/toleration above), unlike the tight
          # t3.medium sizing the app nodes need to share across many pods.
          resources:
            requests:
              cpu: "3000m"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4000m"
              memory: "14Gi"
              nvidia.com/gpu: "1" # extended resources like GPUs require requests == limits
          # Model pull on first boot can take a while depending on
          # network speed - startupProbe gives it room before
          # readiness/liveness start counting failures against it.
          startupProbe:
            exec:
              command: ["sh", "-c", "ollama list | grep -q \"$OLLAMA_MODEL\""]
            periodSeconds: 15
            failureThreshold: 120 # 30 minutes of grace on first pull - matches progressDeadlineSeconds above
          readinessProbe:
            exec:
              command: ["sh", "-c", "ollama list | grep -q \"$OLLAMA_MODEL\""]
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        # Persists the downloaded model across pod restarts - without
        # this, every restart re-downloads several GB for no reason.
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
