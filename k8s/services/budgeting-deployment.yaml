apiVersion: apps/v1
kind: Deployment
metadata:
  name: budgeting
  namespace: veerabank
  labels:
    app: budgeting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budgeting
  template:
    metadata:
      labels:
        app: budgeting
    spec:
      serviceAccountName: backend-app
      containers:
        - name: budgeting
          # Replaced at deploy time with the real ECR image + tag (see deploy.yml)
          image: "<ECR_REPO_URL_BUDGETING>:latest"
          ports:
            - containerPort: 8000
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: TABLE_PREFIX
              value: "veerabank-dev"
            - name: USER_REGISTERED_TOPIC_ARN
              value: "<SNS_USER_REGISTERED_TOPIC_ARN>"
            - name: TRANSACTIONS_SERVICE_URL
              value: "http://transactions-svc.veerabank.svc.cluster.local"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
