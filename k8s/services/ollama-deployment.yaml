apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: veerabank
  labels:
    app: ollama
spec:
  replicas: 1
  # First-ever pull (before anything's been seeded to S3, see the
  # initContainer below) still has to go over the internet and can take a
  # while depending on network speed. Every deploy after the one-time S3
  # seed (see ollama-seed-s3-job.yaml) restores from S3 instead, which is
  # both fast and predictable, similar to why ECR pulls are fast for
  # every other service's images.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      serviceAccountName: backend-app
      # No nodeSelector/toleration - runs on the regular shared node pool
      # like every other service. A dedicated node group would be faster,
      # but creating a second EKS managed node group hit an IAM
      # authorization wall in this account regardless of instance type
      # (not GPU-specific - a plain m6i.2xlarge hit the identical error).
      # Fixing that needs an AWS account admin to widen an IAM
      # policy/PassRole scope - not something Terraform can route around.
      # This S3-restore approach gets the real win (fast, predictable
      # startup) without needing that resolved first.
      initContainers:
        - name: restore-model-from-s3
          image: "public.ecr.aws/aws-cli/aws-cli:latest"
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Attempting to restore model from s3://$OLLAMA_MODEL_CACHE_BUCKET/ ..."
              aws s3 sync "s3://$OLLAMA_MODEL_CACHE_BUCKET/" /root/.ollama/ \
                && echo "Restore attempt finished (empty bucket = nothing to restore yet, that's fine on first run)."
          env:
            - name: OLLAMA_MODEL_CACHE_BUCKET
              value: "<OLLAMA_MODEL_CACHE_BUCKET>"
            - name: AWS_REGION
              value: "us-east-1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: "ollama/ollama:latest"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ollama serve &
              SERVE_PID=$!
              echo "Waiting for Ollama server to come up..."
              until ollama list >/dev/null 2>&1; do sleep 2; done
              echo "Pulling $OLLAMA_MODEL (no-op if already restored from S3 or on the PVC from a previous run)..."
              ollama pull "$OLLAMA_MODEL"
              echo "Ready."
              wait $SERVE_PID
          env:
            # Even lighter than before - Qwen's small models hold up
            # reasonably well at tool/function-calling relative to their
            # size, which matters here (this model has to reliably call
            # verify_recipient_account/send_money). Smaller = faster on
            # CPU, at some real cost to instruction-following reliability
            # - the grounding check in _run_tool (see
            # backend/services/chatbot/app/main.py) exists specifically
            # so a less-reliable model doesn't become a safety problem,
            # just an occasional "ask again" UX hiccup. Must match
            # OLLAMA_MODEL in k8s/services/chatbot-deployment.yaml.
            - name: OLLAMA_MODEL
              value: "qwen2.5:1.5b-instruct"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          # A 1.5B model needs meaningfully less RAM/CPU than the 3B one
          # this used to run - trimmed down accordingly.
          resources:
            requests:
              cpu: "800m"
              memory: "1.5Gi"
            limits:
              cpu: "1200m"
              memory: "2Gi"
          startupProbe:
            exec:
              command: ["sh", "-c", "ollama list | grep -q \"$OLLAMA_MODEL\""]
            periodSeconds: 15
            failureThreshold: 120 # 30 minutes of grace on a first (non-S3) pull - matches progressDeadlineSeconds above
          readinessProbe:
            exec:
              command: ["sh", "-c", "ollama list | grep -q \"$OLLAMA_MODEL\""]
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        # Persists the model across pod restarts on the SAME node -
        # doesn't help across a node replacement/reschedule elsewhere,
        # which is exactly the gap the S3 restore step covers.
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
