name: Deploy Cloud Bank

# Two jobs, matching the README's "CI/CD (fully automated)" section:
#   terraform  ->  provisions/updates infra, exposes outputs to `deploy`
#   deploy     ->  builds & pushes every image, renders k8s manifests
#                  (sed-substituting the terraform outputs in), syncs the
#                  app-secrets Secret (SMTP + Groq) from GitHub Actions
#                  secrets, applies everything, waits for rollouts + ALB.
#
# One-time setup (see README "CI/CD" section for the full list):
#   - The Terraform state bucket + lock table are created automatically by
#     the "Ensure state bucket + lock table exist" step below on first run -
#     no manual bootstrap needed for CI. If AWS reports the configured
#     bucket name as transiently stuck (a recent create/delete on that
#     exact name), it retries, then falls back to a fresh name and commits
#     that into main.tf so subsequent runs are stable.
#     (scripts/bootstrap-state.sh still exists for running terraform by
#     hand outside of CI.)
#   - GitHub secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#     SMTP_USER, SMTP_APP_PASSWORD, TELEGRAM_BOT_TOKEN,
#     TELEGRAM_CHAT_ID

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  NAMESPACE: veerabank

jobs:
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only needed so this job can commit a fallback bucket name into main.tf if the original one is stuck (see "Ensure state bucket..." step)
    outputs:
      ecr_repository_urls: ${{ steps.tf-out.outputs.ecr_repository_urls }}
      backend_irsa_role_arn: ${{ steps.tf-out.outputs.backend_irsa_role_arn }}
      sns_user_registered_topic_arn: ${{ steps.tf-out.outputs.sns_user_registered_topic_arn }}
      transactions_history_api_url: ${{ steps.tf-out.outputs.transactions_history_api_url }}
      telegram_secret_name: ${{ steps.tf-out.outputs.telegram_secret_name }}
      ollama_model_cache_bucket: ${{ steps.tf-out.outputs.ollama_model_cache_bucket }}
      eks_cluster_name: ${{ steps.tf-out.outputs.eks_cluster_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Ensure state bucket + lock table exist
        # Fixes "S3 bucket does not exist" on a fresh AWS account/first run,
        # without a separate manual step: read the bucket name straight out
        # of main.tf's backend block (so CI and any local run always agree
        # on the same bucket) and create it if it isn't there yet. Safe to
        # re-run - every call is idempotent.
        #
        # S3 occasionally answers create-bucket with "OperationAborted: a
        # conflicting conditional operation is currently in progress" for a
        # name that was *just* created or deleted (S3 needs a bit to settle
        # internally) - that's transient, so this retries a few times
        # first. If the name is still stuck after that (e.g. genuinely
        # taken by someone else), it gives up on that name, generates a
        # fresh one, and commits it into main.tf so every future run uses
        # the working bucket instead of hitting the same wall.
        working-directory: terraform
        run: |
          set -euo pipefail
          TABLE=veerabank-terraform-locks

          create_bucket() {
            local name="$1"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$name" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$name" --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$name" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$name" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$name" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          }

          BUCKET=$(grep -oP 'bucket\s+= "\K[^"]+' main.tf)

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket $BUCKET already exists."
          else
            echo "State bucket $BUCKET doesn't exist yet - creating it."
            ok=""
            for attempt in 1 2 3 4 5; do
              if create_bucket "$BUCKET"; then ok=1; break; fi
              echo "create-bucket attempt $attempt failed (likely a transient S3 conflict) - retrying in 10s..."
              sleep 10
            done

            if [ -z "$ok" ]; then
              NEW_BUCKET="veerabank-tfstate-$(aws sts get-caller-identity --query Account --output text)-$(date +%s | tail -c 8)"
              echo "Giving up on $BUCKET - creating a new bucket instead: $NEW_BUCKET"
              create_bucket "$NEW_BUCKET"
              sed -i "s#bucket\s*= \"[^\"]*\"#bucket = \"${NEW_BUCKET}\"#" main.tf
              BUCKET="$NEW_BUCKET"

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add main.tf
              git commit -m "chore: point tfstate backend at working bucket $NEW_BUCKET [skip ci]"
              git push
            fi
          fi

          if aws dynamodb describe-table --table-name "$TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Lock table $TABLE already exists."
          else
            echo "Lock table $TABLE doesn't exist yet - creating it."
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
            aws dynamodb wait table-exists --table-name "$TABLE" --region "$AWS_REGION"
          fi

      - name: terraform init & apply
        # AWS occasionally answers a control-plane call mid-apply with a
        # transient fault (e.g. ElastiCache's "InvalidCredentialsException"
        # + HTTP 408 "This action cannot be completed now. Please try
        # again." - a generic AWS-side retry-me signal, not a real auth or
        # config problem). `terraform apply` with a completed plan is safe
        # to re-run: already-created resources are re-read into state and
        # skipped, so a retry just picks up where it left off instead of
        # recreating anything. Retry a few times before giving up.
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init

          for attempt in 1 2 3; do
            if terraform apply -auto-approve; then
              exit 0
            fi
            echo "terraform apply attempt $attempt failed - likely a transient AWS API fault. Retrying in 30s..."
            sleep 30
          done

          echo "terraform apply failed after 3 attempts."
          exit 1

      - name: Collect outputs
        id: tf-out
        working-directory: terraform
        run: |
          echo "ecr_repository_urls=$(terraform output -json ecr_repository_urls | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "backend_irsa_role_arn=$(terraform output -raw backend_irsa_role_arn)" >> "$GITHUB_OUTPUT"
          echo "sns_user_registered_topic_arn=$(terraform output -raw sns_user_registered_topic_arn)" >> "$GITHUB_OUTPUT"
          echo "transactions_history_api_url=$(terraform output -raw transactions_history_api_url)" >> "$GITHUB_OUTPUT"
          echo "telegram_secret_name=$(terraform output -raw telegram_secret_name)" >> "$GITHUB_OUTPUT"
          echo "ollama_model_cache_bucket=$(terraform output -raw ollama_model_cache_bucket)" >> "$GITHUB_OUTPUT"
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build, push, deploy
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build & push every image
        # Builds/pushes up to 6 images concurrently instead of one at a
        # time - with 30+ images in this project, the old sequential loop
        # was the single biggest chunk of total pipeline time. Capped at
        # 6 (not unlimited) since GitHub-hosted runners have limited CPU -
        # Docker builds are mostly I/O-bound on layer pull/push though, so
        # some oversubscription still helps overall throughput.
        env:
          ECR_URLS: ${{ needs.terraform.outputs.ecr_repository_urls }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export ECR_URLS SHA

          build_one() {
            svc="$1"
            url=$(echo "$ECR_URLS" | jq -r --arg s "$svc" '.[$s]')
            if [ "$svc" = "frontend" ]; then
              docker build -f frontend/Dockerfile -t "$url:$SHA" -t "$url:latest" frontend
            else
              docker build -f "backend/services/$svc/Dockerfile" -t "$url:$SHA" -t "$url:latest" backend
            fi
            docker push "$url:$SHA"
            docker push "$url:latest"
          }
          export -f build_one

          echo "$ECR_URLS" | jq -r 'keys[]' | xargs -P 6 -I {} bash -c 'build_one "$@"' _ {}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ needs.terraform.outputs.eks_cluster_name }}"

      - name: Render manifests
        # Same substitutions the README describes doing by hand ("Wire up
        # the manifests"), scripted: every <ECR_REPO_URL_X> placeholder,
        # <SNS_USER_REGISTERED_TOPIC_ARN>, <TRANSACTIONS_HISTORY_API_URL>,
        # <OLLAMA_MODEL_CACHE_BUCKET>, and the serviceaccount's IRSA
        # role-arn annotation.
        env:
          ECR_URLS: ${{ needs.terraform.outputs.ecr_repository_urls }}
          IRSA_ROLE_ARN: ${{ needs.terraform.outputs.backend_irsa_role_arn }}
          SNS_TOPIC_ARN: ${{ needs.terraform.outputs.sns_user_registered_topic_arn }}
          HISTORY_API_URL: ${{ needs.terraform.outputs.transactions_history_api_url }}
          OLLAMA_BUCKET: ${{ needs.terraform.outputs.ollama_model_cache_bucket }}
        run: |
          set -euo pipefail
          mkdir -p rendered/services rendered/frontend

          cp k8s/namespace.yaml rendered/namespace.yaml
          cp k8s/ingress.yaml rendered/ingress.yaml

          sed "s#eks.amazonaws.com/role-arn:.*#eks.amazonaws.com/role-arn: \"${IRSA_ROLE_ARN}\"#" \
            k8s/serviceaccount.yaml > rendered/serviceaccount.yaml

          for f in k8s/services/*.yaml; do
            svc=$(basename "$f" | sed -E 's/-(deployment|service)\.yaml$//')
            placeholder="<ECR_REPO_URL_$(echo "$svc" | tr '[:lower:]-' '[:upper:]_')>:latest"
            url=$(echo "$ECR_URLS" | jq -r --arg s "$svc" '.[$s] // empty')
            out="rendered/services/$(basename "$f")"
            sed \
              -e "s#${placeholder}#${url}:${{ github.sha }}#" \
              -e "s#<SNS_USER_REGISTERED_TOPIC_ARN>#${SNS_TOPIC_ARN}#" \
              -e "s#<TRANSACTIONS_HISTORY_API_URL>#${HISTORY_API_URL}#" \
              -e "s#<OLLAMA_MODEL_CACHE_BUCKET>#${OLLAMA_BUCKET}#" \
              "$f" > "$out"
          done

          fe_url=$(echo "$ECR_URLS" | jq -r '.frontend')
          sed "s#<ECR_REPO_URL_FRONTEND>:latest#${fe_url}:${{ github.sha }}#" \
            k8s/frontend/deployment.yaml > rendered/frontend/deployment.yaml
          cp k8s/frontend/service.yaml rendered/frontend/service.yaml

      - name: Sync alertmanager Telegram config
        # Same pattern as "Sync app-secrets" below: pull straight from
        # GitHub Actions secrets, substitute into the checked-in template
        # (which only has placeholders), and write directly into the
        # cluster - the rendered file with real values never touches the
        # repo, disk beyond /tmp, or logs. kubectl apply makes this
        # idempotent. Runs before "Apply manifests" isn't required (the
        # monitoring namespace + Alertmanager already exist from the
        # terraform job's helm_release) but doing it early means
        # Alertmanager comes up with Telegram alerting already wired
        # instead of sitting pending until the next deploy.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          sed \
            -e "s#<TELEGRAM_BOT_TOKEN>#${TELEGRAM_BOT_TOKEN}#" \
            -e "s#<TELEGRAM_CHAT_ID>#${TELEGRAM_CHAT_ID}#" \
            k8s/monitoring/alertmanager.yaml > /tmp/alertmanager.yaml
          kubectl create secret generic alertmanager-config \
            --namespace monitoring \
            --from-file=alertmanager.yaml=/tmp/alertmanager.yaml \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/alertmanager.yaml

      - name: Sync Telegram credentials to Secrets Manager
        # Same "never through Terraform state" reasoning as the step above,
        # via AWS Secrets Manager instead of a k8s Secret since the
        # consumer here is notification-writer Lambda, not a pod. The
        # secret container itself is created by Terraform
        # (terraform/modules/lambda/main.tf, aws_secretsmanager_secret.telegram)
        # with no value; this is the only place the real bot token/chat id
        # ever get written, straight from GitHub secrets to AWS, and
        # `put-secret-value` is safe to re-run every deploy.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SECRET_NAME: ${{ needs.terraform.outputs.telegram_secret_name }}
        run: |
          set -euo pipefail
          aws secretsmanager put-secret-value \
            --secret-id "$TELEGRAM_SECRET_NAME" \
            --secret-string "$(jq -nc --arg t "$TELEGRAM_BOT_TOKEN" --arg c "$TELEGRAM_CHAT_ID" '{bot_token:$t, chat_id:$c}')"

      - name: Sync app-secrets (Gmail)
        # Pulled straight from GitHub Actions secrets and written into the
        # cluster - never written to a file in the repo, never logged.
        # kubectl apply makes this idempotent, so re-running is safe.
        # (Host/port/from-address for SMTP default to Gmail's in
        # backend/common/mailer.py, so only these two SMTP values are
        # needed. chatbot-service no longer needs a secret here at all -
        # it talks to the self-hosted Ollama deployment, no external API.)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          kubectl apply -f rendered/namespace.yaml
          kubectl create secret generic app-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=SMTP_USER="$SMTP_USER" \
            --from-literal=SMTP_APP_PASSWORD="$SMTP_APP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          kubectl apply -f rendered/serviceaccount.yaml
          kubectl apply -f rendered/services/
          kubectl apply -f rendered/frontend/
          kubectl apply -f rendered/ingress.yaml
          kubectl apply -f k8s/monitoring/grafana-ingress.yaml

      - name: Wait for rollouts
        # Runs every deployment's rollout-status check concurrently
        # instead of one at a time - the old sequential version made
        # total wait time the SUM of every deployment's individual wait,
        # this makes it the MAX of the slowest single one instead.
        run: |
          set -euo pipefail
          pids=()
          for f in rendered/services/*-deployment.yaml; do
            name=$(basename "$f" -deployment.yaml)
            # ollama's first-ever rollout has to pull a multi-GB model
            # from the public internet before its startupProbe passes
            # (see k8s/services/ollama-deployment.yaml) - the default
            # 300s is nowhere near enough for that one specifically.
            # Every redeploy after the first is fast (model persists on
            # its PVC), but CI can't assume it isn't the first. Kept in
            # sync with progressDeadlineSeconds on that Deployment (1800s).
            timeout="300s"
            if [ "$name" = "ollama" ]; then timeout="1800s"; fi
            kubectl rollout status "deployment/$name" -n "$NAMESPACE" --timeout="$timeout" &
            pids+=($!)
          done
          kubectl rollout status deployment/frontend -n "$NAMESPACE" --timeout=300s &
          pids+=($!)

          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more deployments failed to roll out - see the failed rollout-status line(s) above."
            exit 1
          fi

      - name: Wait for ALB and print URL
        run: |
          set -euo pipefail
          HOST=""
          for i in $(seq 1 30); do
            HOST=$(kubectl get ingress veerabank-ingress -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$HOST" ] && break
            sleep 10
          done
          echo "### Cloud Bank is live at: http://${HOST:-<pending - check kubectl get ingress>}/" >> "$GITHUB_STEP_SUMMARY"

          GRAFANA_HOST=""
          for i in $(seq 1 30); do
            GRAFANA_HOST=$(kubectl get ingress grafana-ingress -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$GRAFANA_HOST" ] && break
            sleep 10
          done
          echo "### Grafana is live at: http://${GRAFANA_HOST:-<pending - check kubectl get ingress -n monitoring>}/ (user: admin, password: \`terraform output -raw grafana_admin_password\`)" >> "$GITHUB_STEP_SUMMARY"
